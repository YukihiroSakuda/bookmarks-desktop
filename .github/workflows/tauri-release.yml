name: Tauri Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # The extension is built and zipped into the app during `tauri build`
      # (beforeBuildCommand), so its dependencies are needed too.
      # bash (run with -e): under the default PowerShell only the last line's
      # failure fails the step.
      - name: Install Node dependencies
        shell: bash
        run: |
          npm ci
          npm ci --prefix extension

      # タグ push 時のみ GitHub Release を作成する
      - name: Build and create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bookmarks ${{ github.ref_name }}'
          releaseBody: |
            ## インストール方法

            1. `Bookmarks_*_x64-setup.exe` をダウンロードしてインストーラーを実行します。
            2. ブラウザ拡張機能はアプリのヘルプダイアログからダウンロードできます。

            ---
            変更内容は [このバージョンまでのコミット履歴](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) を参照してください。
          releaseDraft: true
          prerelease: false

      # workflow_dispatch (手動実行) 時はビルドのみ、リリースなし
      - name: Build only (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
